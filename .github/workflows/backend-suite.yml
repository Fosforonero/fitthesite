# ============================================================================
# CI BACKEND — perimetro, tipi e suite completa su un PG17 EFFIMERO.
#
# COSA NON FA, ed e' la parte importante
# --------------------------------------
# Non distribuisce niente. Nessun deploy Vercel, nessun `next build`, nessun
# upload di artefatti, nessun artefatto di rilascio. I permessi del token sono
# di sola lettura. Il database e' un container creato e distrutto qui dentro:
# ne' il Supabase condiviso ne' quello live vengono mai toccati — la guardia in
# supabase/tests/bersaglio.sh rifiuta per nome qualunque bersaglio che assomigli
# al condiviso o alla produzione, e pretende una sentinella che solo il harness
# di test sa creare.
#
# PERCHE' ESISTE
# --------------
# Fino al 26/08/2026 nessuna CI eseguiva questa suite: `fitthesite/.github/`
# conteneva un solo workflow, che non lancia i test. E' la stessa forma del
# difetto trovato sul lato app, dove il workflow Flutter puntava a una
# directory con zero file tracciati e quindi non partiva mai. Una suite che
# nessuno esegue non e' un cancello.
#
# IL GATE VERO E' UNO SCRIPT, NON QUESTO FILE
# -------------------------------------------
# `tools/gate-release-suite.sh` fa tutto: costruisce il PG17, applica le 122
# migration, crea la sentinella, esegue la suite in modalita' release (zero
# skip ambientali) e distrugge il database verificando che sia sparito. Lo
# stesso comando si lancia in locale. Se la CI e' rossa e il locale e' verde,
# la differenza sta nell'ambiente e si cerca li', invece di indovinare.
# ============================================================================
name: Backend — perimetro, tipi e suite

on:
  # Niente ancore YAML (&x / *x): GitHub Actions non le supporta ufficialmente,
  # e il 26/08/2026 un push che toccava SOLO questo file non ha prodotto nessun
  # run mentre push precedenti l'avevano fatto. L'elenco e' ripetuto due volte
  # di proposito: due liste identiche e visibili valgono piu' di una lista sola
  # che a volte non viene risolta. `test/ci-backend.test.ts` verifica che
  # restino uguali.
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "test/**"
      - "tools/**"
      - "supabase/**"
      - "middleware.ts"
      - "middleware.matcher.test.ts"
      - "suite-scope.test.ts"
      - "vitest.config.ts"
      - "vitest.setup.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/backend-suite.yml"
  push:
    branches:
      - "integra/**"
      - "preservazione/**"
      - "hotfix/**"
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "test/**"
      - "tools/**"
      - "supabase/**"
      - "middleware.ts"
      - "middleware.matcher.test.ts"
      - "suite-scope.test.ts"
      - "vitest.config.ts"
      - "vitest.setup.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/backend-suite.yml"
# Sola lettura: questo workflow non deve poter scrivere niente, da nessuna parte.
permissions:
  contents: read

concurrency:
  group: backend-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Perimetro, tipi e suite su PG17 effimero
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Il bersaglio e' dichiarato QUI, una volta, e non ha valori di ripiego
      # da nessun'altra parte. Nomi deliberatamente lontani da qualunque cosa
      # somigli al condiviso: la guardia li rifiuterebbe comunque per nome.
      CONT_NAME: pg17-ci-effimero
      SUPABASE_DB_CONTAINER: pg17-ci-effimero
      SUPABASE_DB_NAME: ricostruzione
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Storia completa: le copie congelate in test/billing-route-fixtures/
          # si verificano contro i COMMIT COMPLETI dichiarati nel manifesto. Col
          # checkout superficiale predefinito quegli oggetti non esistono, e il
          # test fallirebbe per assenza della storia invece che per una copia
          # divergente — cioe' per il motivo sbagliato.
          #
          # Prima qui si recuperava il ref `main`, perche' il vecchio test si
          # confrontava con un branch. Non piu': un branch si muove, e infatti
          # si era mosso.
          fetch-depth: 0

      - name: I commit congelati delle fixture devono esserci
        run: |
          set -uo pipefail
          mancanti=0
          while read -r sha file; do
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "ok       ${file} <- ${sha}"
            else
              echo "ROSSO    ${file}: il commit ${sha} non e' nell'archivio."
              mancanti=1
            fi
          done < <(python3 -c "import json;[print(f['commit'],f['file']) for f in json.load(open('test/billing-route-fixtures/manifesto.json'))['fixture']]")
          if [ "${mancanti}" -ne 0 ]; then
            echo "       Senza quegli oggetti la verifica di provenienza non misura"
            echo "       niente, e un rosso li' direbbe «la copia e' divergente»"
            echo "       quando il problema e' il checkout."
            exit 1
          fi

      - name: actionlint sui workflow
        # Un workflow rotto non puo' validare se stesso: se lo si spezza, non
        # parte proprio. Questo passo serve al caso utile, cioe' la PR che lo
        # modifica: li' gira ancora la versione buona, e la modifica viene
        # controllata prima di entrare.
        run: |
          set -uo pipefail
          docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.7 -color
          esito=$?
          if [ "${esito}" -ne 0 ]; then
            echo "ROSSO: actionlint ha trovato problemi nei workflow (uscita ${esito})."
            exit 1
          fi
          echo "actionlint: nessun problema"

      - name: Node congelato (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Le tre dichiarazioni di Node devono combaciare
        # `.nvmrc` diceva «22», che congela solo la major: due esecuzioni a
        # distanza di un mese avrebbero potuto usare due Node diversi e
        # chiamarsi entrambe «toolchain congelata». Adesso `.nvmrc` porta la
        # versione ESATTA ed e' l'unica autorita'; `engines` dichiara il
        # pavimento vero, che non e' un'opinione ma il requisito di pnpm
        # 11.15.0 (`engines.node: >=22.13`). Prima diceva `>=20`, cioe'
        # permetteva un'installazione che non puo' funzionare.
        run: |
          set -uo pipefail
          atteso="$(tr -d ' \t\n\r' < .nvmrc)"
          effettivo="$(node -p "process.versions.node")"
          pavimento="$(node -p "require('./package.json').engines.node")"
          echo ".nvmrc=${atteso}  node=${effettivo}  engines.node=${pavimento}"
          if [ "${atteso}" != "${effettivo}" ]; then
            echo "ROSSO: .nvmrc chiede ${atteso} e gira ${effettivo}."
            exit 1
          fi
          if ! node -e "
            const [a,b,c] = process.versions.node.split('.').map(Number);
            const m = require('./package.json').engines.node.match(/>=\s*(\d+)\.(\d+)\.(\d+)/);
            if (!m) { console.error('engines.node non e\' un pavimento leggibile'); process.exit(1); }
            const [x,y,z] = m.slice(1).map(Number);
            const ok = a > x || (a === x && (b > y || (b === y && c >= z)));
            process.exit(ok ? 0 : 1);
          "; then
            echo "ROSSO: ${effettivo} non soddisfa engines.node ${pavimento}."
            exit 1
          fi
          echo "le tre dichiarazioni combaciano"

      - name: pnpm congelato (packageManager di package.json)
        # La prima esecuzione di questo workflow, il 26/08/2026, e' morta qui
        # con un `No such built-in module: node:sqlite` incomprensibile. La
        # causa vera stava due righe sopra: `.nvmrc` diceva 20 e
        # `packageManager` chiedeva pnpm 11.15, che pretende Node >= 22.13.
        # Le due dichiarazioni del repository erano incompatibili fra loro, e
        # nessuno se n'era accorto perche' nessuna CI eseguiva niente.
        #
        # `.nvmrc` e' stato portato alla versione esatta e `engines` al
        # pavimento vero. Il controllo qui sotto resta perche' la prossima volta
        # il messaggio deve dire QUALE delle dichiarazioni non torna, invece di
        # uno stack trace di corepack.
        run: |
          set -uo pipefail
          atteso="$(node -p "require('./package.json').packageManager")"
          echo "node $(node --version) (da .nvmrc), packageManager dichiarato: ${atteso}"
          corepack enable
          corepack prepare "${atteso}" --activate > /tmp/corepack.txt 2>&1
          codice=$?
          cat /tmp/corepack.txt
          effettivo="pnpm@$(pnpm --version 2>/dev/null)"
          if [ "${codice}" -ne 0 ] || [ "${effettivo}" != "${atteso}" ]; then
            echo "ROSSO: pnpm effettivo «${effettivo}», atteso «${atteso}»."
            echo "       Le due dichiarazioni del repository devono combaciare:"
            echo "       .nvmrc = $(cat .nvmrc)   package.json packageManager = ${atteso}"
            grep -i "requires at least" /tmp/corepack.txt || true
            exit 1
          fi
          echo "pnpm ${effettivo}, come dichiarato"

      - name: Dipendenze dal lockfile
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        # Niente lint: in questo repository ESLint non e' installato ne'
        # configurato (`next lint` chiederebbe di configurarlo, in modo
        # interattivo). Introdurlo e' una decisione a se', con il suo arretrato.
        run: npx tsc --noEmit

      - name: Il bersaglio non e' mai il Supabase condiviso
        run: |
          set -euo pipefail
          for v in "${SUPABASE_DB_CONTAINER}" "${SUPABASE_DB_NAME}"; do
            # `*prod*` copre gia' `*production*`: elencarli entrambi farebbe dire
            # a shellcheck che il secondo non puo' mai combaciare (SC2222).
            case "$v" in
              *supabase_db*|*prod*|*live*|*fitmesh_db*)
                echo "ROSSO: bersaglio vietato «${v}»."; exit 1 ;;
            esac
          done
          echo "bersaglio: ${SUPABASE_DB_CONTAINER}/${SUPABASE_DB_NAME}"

      - name: Gate di release — PG17 effimero, migration, sentinella, suite
        # Un solo comando, lo stesso che si lancia in locale. Costruisce il
        # database, applica la catena, crea la sentinella, esegue la suite in
        # modalita' release (zero skip ambientali, i sei test contro il
        # database eseguiti davvero) e verifica il conteggio congelato di file
        # e test. Fallisce su zero test, su deriva, su skip ambientali e su
        # bersaglio non isolato.
        run: bash tools/gate-release-suite.sh --costruisci

      - name: Pulizia, sempre
        if: always()
        run: |
          docker rm -f "${CONT_NAME}" >/dev/null 2>&1 || true
          rimasti="$(docker ps -aq -f "name=^${CONT_NAME}$" | wc -l | tr -d ' ')"
          echo "container residui con quel nome: ${rimasti}"
          if [ "${rimasti}" != "0" ]; then
            echo "ROSSO: il container effimero e' sopravvissuto."
            exit 1
          fi

      - name: Referto
        if: always()
        run: |
          echo "node:  $(node --version)"
          echo "pnpm:  $(pnpm --version)"
          echo "gate:  tools/gate-release-suite.sh"
          echo "deploy: nessuno. Questo workflow non distribuisce e non carica artefatti."
