<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fmGradient" x1="80" y1="60" x2="520" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CFF5B"/>
      <stop offset="45%" stop-color="#21E6C1"/>
      <stop offset="100%" stop-color="#1DA1FF"/>
    </linearGradient>

    <linearGradient id="syncGradient" x1="700" y1="240" x2="1250" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CFF5B"/>
      <stop offset="45%" stop-color="#21E6C1"/>
      <stop offset="100%" stop-color="#1DA1FF"/>
    </linearGradient>

    <linearGradient id="dividerGradient" x1="0" y1="0" x2="0" y2="220">
      <stop offset="0%" stop-color="#7CFF5B"/>
      <stop offset="100%" stop-color="#1DA1FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" rx="40" fill="#050816"/>

  <!-- FM Symbol -->
  <g transform="translate(70,55)">

    <!-- F -->
    <path d="
      M40 260
      C65 260, 78 250, 92 220
      L145 100
      C155 78, 170 70, 198 70
      L355 70
      C375 70, 392 60, 405 35
      L220 35
      C150 35, 110 58, 85 120
      L20 260
      Z

      M135 145
      L290 145
      C305 145, 320 136, 328 118
      L150 118
      Z
    " fill="url(#fmGradient)"/>

    <!-- M -->
    <path d="
      M350 170
      L430 245
      L560 120
      C585 96, 620 108, 620 145
      L620 260
      L575 260
      L575 160
      L432 295
      L305 175
      Z
    " fill="url(#fmGradient)"/>

    <!-- Soundwave -->
    <g transform="translate(250,230)">
      <rect x="0" y="35" width="16" height="40" rx="8" fill="url(#syncGradient)"/>
      <rect x="35" y="10" width="16" height="90" rx="8" fill="url(#syncGradient)"/>
      <rect x="70" y="0" width="16" height="110" rx="8" fill="url(#syncGradient)"/>
      <rect x="105" y="20" width="16" height="70" rx="8" fill="url(#syncGradient)"/>
      <rect x="140" y="35" width="16" height="40" rx="8" fill="url(#syncGradient)"/>
    </g>
  </g>

  <!-- Divider -->
  <rect x="650" y="70" width="4" height="280" rx="2" fill="url(#dividerGradient)"/>

  <!-- FitMesh -->
  <text x="730" y="190"
        fill="white"
        font-family="Inter, Arial, sans-serif"
        font-size="120"
        font-weight="800"
        font-style="italic"
        letter-spacing="-4">
    FitMesh
  </text>

  <!-- Sync -->
  <g transform="translate(760,250)">

    <line x1="0" y1="28" x2="120" y2="28"
          stroke="url(#syncGradient)"
          stroke-width="8"
          stroke-linecap="round"/>

    <text x="150" y="45"
          fill="url(#syncGradient)"
          font-family="Space Grotesk, Inter, Arial, sans-serif"
          font-size="72"
          font-weight="700"
          letter-spacing="18">
      SYNC
    </text>

    <line x1="560" y1="28" x2="680" y2="28"
          stroke="url(#syncGradient)"
          stroke-width="8"
          stroke-linecap="round"/>
  </g>
</svg>
