# Supabase CLI configuration.
# Vedi https://supabase.com/docs/guides/cli/config per la reference completa.

# A unique-ish id for this project (matches `supabase link --project-ref <ref>`).
project_id = "fitmesh"

[api]
enabled = true
# Lo schema esposto via PostgREST. Tutte le tabelle pubbliche stanno qui.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/it/auth/callback",
  "http://localhost:3000/en/auth/callback",
  "https://fitmesh.fit/it/auth/callback",
  "https://fitmesh.fit/en/auth/callback",
  "https://www.fitmesh.fit/it/auth/callback",
  "https://www.fitmesh.fit/en/auth/callback",
  "fitmesh://auth/callback"
]
jwt_expiry = 3600           # 1 hour access token
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true     # Conferma email per nuove registrazioni
max_frequency = "1m"            # Anti-spam: max 1 magic link/min per email

[auth.email.template.confirmation]
subject = "Conferma il tuo account FitMesh"

[auth.email.template.magic_link]
subject = "Il tuo link di accesso FitMesh"

[auth.sms]
enable_signup = false
enable_confirmations = false

# OAuth providers (Phase 9, ora disabilitati)
# [auth.external.google]
# enabled = false
# [auth.external.apple]
# enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
