# ── Deriva del 31/08/2026, seconda (M17, ancoraggio della catena JWS) ───────
# 44 -> 45 file, 760 -> 768 test. Cosa e' entrato:
#   +1 file  lib/billing/app-store-jws-ancoraggio.test.ts (8 test)
#
# Chiude M17: fino a oggi nessun test dimostrava che i byte dei root Apple
# arrivassero dentro `SignedDataVerifier` e vi facessero qualcosa. Il caso
# negativo esistente usava `x5c: []`, che inciampa nel controllo di lunghezza
# della catena molto prima dell'ancoraggio, quindi una catena BEN FORMATA e
# autofirmata da chiunque sarebbe stata accettata con la suite verde.
#
# Il file porta una catena sintetica vera (radice, intermedio, foglia; EC
# P-256, firme reali, e le due estensioni Apple che la libreria pretende) e
# misura che, cambiando SOLO il trust store, il guasto si sposta: con i root
# Apple e' VERIFICATION_FAILURE, cioe' l'ancoraggio; con la propria radice la
# catena passa per intero e si ferma dopo, sull'OCSP.
#
# Due mutazioni provate il 31/08: spegnere `enableOnlineChecks` rende rosso 1
# caso, aggiungere la radice sintetica ai root Apple ne rende rossi 2.

